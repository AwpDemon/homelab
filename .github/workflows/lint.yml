name: lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check health script
        run: python -m py_compile scripts/lab-health.py

      - name: Validate YAML configs
        run: |
          pip install pyyaml
          python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('configs').glob('*.yml')]"

      - name: Validate TOML configs
        run: |
          python -c "import tomllib, pathlib; [tomllib.loads(p.read_text()) for p in pathlib.Path('configs').glob('*.toml')]"

      - name: Dry-run health script (placeholders will report CRIT — exit code ignored)
        run: |
          python scripts/lab-health.py --json || true
