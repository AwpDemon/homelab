# Velocity proxy config — config.toml (sanitized)
#
# Velocity sits in front of the Minecraft backend. The backend's firewall
# only accepts connections from the proxy host, so if somebody figures
# out the backend IP directly, they hit a closed port. The proxy is
# protocol-aware, which lets it drop malformed handshakes before the
# backend ever sees the packet.

bind = "0.0.0.0:25565"
motd = "<a service motd>"
show-max-players = 32
online-mode = true              # Mojang auth — blocks cracked clients

# Force key re-signing forces 1.19+ clients through a canonical keying
# path, which helps with one class of bot-joiner exploit.
force-key-authentication = true

# Modern forwarding passes a signed payload to the backend so you can
# trust the player IP on the backend side instead of the proxy IP.
player-info-forwarding-mode = "MODERN"
forwarding-secret-file = "forwarding.secret"    # chmod 600

prevent-client-proxy-connections = true

[servers]
# The backend. Only reachable from this proxy host's IP.
main = "10.0.0.50:25566"
try = ["main"]

[advanced]
# Kick noisy / malformed clients instead of letting them hang on handshake
show-ping-requests = false
announce-forge = false

# Compression threshold — negotiate smaller packets for slow connections
compression-threshold = 256
compression-level = -1          # default (zlib default)

# Connection-rate limits — most of these got tuned during the L7 event
connection-timeout = 5000
read-timeout = 30000
login-ratelimit = 3000          # ms between login attempts per IP

# Haproxy/PROXY protocol on the wire-facing side so downstream sees
# the real client IP even through the upstream provider
haproxy-protocol = true

[query]
enabled = false                  # don't expose server query — it's a vector
